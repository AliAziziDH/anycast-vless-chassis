<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Telemetry Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
        }
    </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-bold mb-8 text-center text-cyan-400 drop-shadow-md">🚀 VPN Telemetry Node</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="bg-slate-800 p-6 rounded-lg shadow-lg border border-slate-700">
                <h2 class="text-sm uppercase text-slate-400 mb-2">CPU Usage</h2>
                <p class="text-3xl font-mono text-emerald-400" id="cpu-val">--%</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-lg shadow-lg border border-slate-700">
                <h2 class="text-sm uppercase text-slate-400 mb-2">Memory Usage</h2>
                <p class="text-3xl font-mono text-emerald-400" id="mem-val">--%</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-lg shadow-lg border border-slate-700">
                <h2 class="text-sm uppercase text-slate-400 mb-2">Total Bandwidth</h2>
                <p class="text-3xl font-mono text-cyan-400" id="bw-val">-- GB</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-lg shadow-lg border border-slate-700">
                <h2 class="text-sm uppercase text-slate-400 mb-2">Active Connections</h2>
                <p class="text-3xl font-mono text-purple-400" id="conn-val">--</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-slate-800 p-6 rounded-lg shadow-lg border border-slate-700">
                <h2 class="text-xl mb-4 font-semibold text-slate-200">System Resources</h2>
                <canvas id="sysChart"></canvas>
            </div>
            <div class="bg-slate-800 p-6 rounded-lg shadow-lg border border-slate-700">
                <h2 class="text-xl mb-4 font-semibold text-slate-200">Avg BBR Pacing (Mbps)</h2>
                <canvas id="bbrChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const MAX_POINTS = 20;

        // Init Charts
        const sysCtx = document.getElementById('sysChart').getContext('2d');
        const sysChart = new Chart(sysCtx, {
            type: 'line',
            data: {
                labels: Array(MAX_POINTS).fill(''),
                datasets: [
                    { label: 'CPU %', borderColor: '#34d399', backgroundColor: 'rgba(52, 211, 153, 0.1)', data: Array(MAX_POINTS).fill(0), fill: true, tension: 0.4 },
                    { label: 'MEM %', borderColor: '#60a5fa', backgroundColor: 'rgba(96, 165, 250, 0.1)', data: Array(MAX_POINTS).fill(0), fill: true, tension: 0.4 }
                ]
            },
            options: {
                responsive: true,
                animation: false,
                scales: { y: { beginAtZero: true, max: 100, grid: {color: '#334155'} }, x: { grid: {display: false} } },
                plugins: { legend: { labels: { color: '#cbd5e1' } } }
            }
        });

        const bbrCtx = document.getElementById('bbrChart').getContext('2d');
        const bbrChart = new Chart(bbrCtx, {
            type: 'line',
            data: {
                labels: Array(MAX_POINTS).fill(''),
                datasets: [
                    { label: 'Avg Bandwidth (Mbps)', borderColor: '#a78bfa', backgroundColor: 'rgba(167, 139, 250, 0.2)', data: Array(MAX_POINTS).fill(0), fill: true, tension: 0.4 }
                ]
            },
            options: {
                responsive: true,
                animation: false,
                scales: { y: { beginAtZero: true, grid: {color: '#334155'} }, x: { grid: {display: false} } },
                plugins: { legend: { labels: { color: '#cbd5e1' } } }
            }
        });

        function updateData(dataset, val) {
            dataset.push(val);
            if (dataset.length > MAX_POINTS) dataset.shift();
        }

        async function fetchTelemetry() {
            try {
                // Determine base URL dynamically depending on where the dashboard is loaded
                const res = await fetch('/api/telemetry');
                const data = await res.json();

                // Update Top Stats
                document.getElementById('cpu-val').textContent = data.cpu_percent + '%';
                document.getElementById('mem-val').textContent = data.mem_percent + '%';
                document.getElementById('bw-val').textContent = data.bandwidth_gb.toFixed(2) + ' GB';
                document.getElementById('conn-val').textContent = data.connections;

                // Update Charts
                updateData(sysChart.data.datasets[0].data, data.cpu_percent);
                updateData(sysChart.data.datasets[1].data, data.mem_percent);
                sysChart.update();

                updateData(bbrChart.data.datasets[0].data, data.bbr_avg_bw_mbps);
                bbrChart.update();

            } catch (err) {
                console.error("Telemetry fetch failed:", err);
            }
        }

        // Poll every 3 seconds
        setInterval(fetchTelemetry, 3000);
        fetchTelemetry();
    </script>
</body>
</html>
